# Build and test on GitHub-hosted runners, in shadow of CircleCI.
#
# beancounter is public, so GitHub's standard hosted runners are free and
# unlimited. ubuntu-24.04-arm gives 4 vCPU and 16 GB on arm64, the same
# architecture as kauri. CircleCI's `large` gives 4 vCPU and 8 GB and spends
# most of the free plan's 30k monthly credits on build-and-test.
#
# Shadow phase: this job only builds and tests. Images, jars, coverage and Snyk
# stay on CircleCI, and bc-deploy still reads CircleCI's pipeline number. Do not
# push images from here until cutover: CircleCI has already pushed tags 1-3859
# to ghcr, and a GitHub run_number would overwrite them.
#
# Keep this on GitHub's runners, never the kauri self-hosted runner. The
# repository is public, so any fork PR would run code on a VM with a route to
# the LAN (network/GH_RUNNER.md, GitHub's self-hosted runner guidance).
name: Build

on:
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md']
  push:
    branches: [main, 'deploy/**']
    paths-ignore: ['**/*.md']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      # Same JVM limits as CircleCI's java-build executor, so the timings compare.
      _JAVA_OPTIONS: "-Xms512m -Xmx1536m"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build and test
        env:
          # The Sentry Gradle plugin uploads source bundles when CI is true.
          # CircleCI still owns that upload, and a fork PR has no
          # SENTRY_AUTH_TOKEN, so keep it off here.
          CI: "false"
        run: ./gradlew build --parallel

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '*/build/reports/tests/'
          retention-days: 7
