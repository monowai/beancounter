---
# Codacy configuration
# https://docs.codacy.com/repositories-configure/codacy-configuration-file/

engines:
  # Disable TSQLLint - it's for SQL Server, not PostgreSQL
  tsqllint:
    enabled: false
  # Complexity is a production-code metric. Tests stay in issue analysis, but a
  # renamed or split test class reads as all-new complexity, since the deleted
  # original is not credited.
  metric:
    exclude_paths:
      - "**/src/test/**"
      - "**/src/contractTest/**"
      - "**/src/testFixtures/**"

exclude_paths:
  # Exclude generated files
  - "**/build/**"
  - "**/generated/**"
  # Exclude AI assistant instructions
  - "CLAUDE.md"
  # Exclude Flyway migrations - Postgres DDL, not SQL Server; TSQLLint reports false positives
  - "**/db/migration/**"
