server:
  port: 0

stream:
  enabled: true

spring:
  flyway:
    enabled: false
  cloud:
    function:
      # Only enable portfolio consumer for lightweight Test Binder tests
      definition: portfolioConsumer
    stream:
      defaultBinder: test
      bindings:
        # Portfolio Updates Consumer
        portfolioConsumer-in-0:
          destination: test-pos-mv
          content-type: application/json
        # Corporate Event Producer (StreamBridge)
        corporateEvent-out-0:
          destination: test-ca-event
          content-type: application/json
        # Recurring payslip due, to svc-retire (StreamBridge)
        payslipDue-out-0:
          destination: test-payslip-due
          content-type: application/json
        # Payslip transactions from svc-retire (bound only when added to the definition)
        payslipTrnConsumer-in-0:
          destination: test-payslip-trn
          content-type: application/json
  datasource:
    username: sa
    password:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL

beancounter:
  enricher: DEFAULT
  indices:
    seed-on-startup: false
  market.providers:
    alpha:
      markets: NASDAQ,AMEX,NYSE,ASX,LON,US
    mstack:
      markets: NZX
    fx:
      url: http://localhost:${wiremock.server.port:0}
      key: test
