server:
  port: 9530
  servlet:
    context-path: '/'
  shutdown: graceful

sentry:
  enabled: false
  environment: local
  traces-sample-rate: 1
  debug: false
  # Drop high-frequency RabbitMQ noise from APM (see svc-position application.yml).
  ignored-transactions:
    - "basic\\.ack"
    - "bc-perf-invalidate-.*"

beancounter:
  sentry:
    # Chat traces must land even when bc-view's parent trace was not sampled —
    # they carry the per-request token telemetry (beancounter#1129). Prefix
    # match: covers /agent/query and /agent/query/stream.
    always-sample-paths: /agent/query


marketdata:
  url: "http://localhost:9510/api"
event:
  url: "http://localhost:9520/api"
position:
  url: "http://localhost:9500/api"
retire:
  url: "http://localhost:9540/api"
rebalance:
  url: "http://localhost:9550/api"

springdoc:
  use-management-port: true

management:
  server:
    port: 9531
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure.include: '*'
  health:
    livenessstate:
      enabled: true
    readinessState:
      enabled: true
  info:
    git:
      mode: SIMPLE
  # Sample every Micrometer observation so Spring AI's gen_ai.* spans —
  # which now feed Sentry's GenAI dashboard via the OTel bridge — never
  # get dropped. Adjust per-env in application-<profile>.yaml if cost
  # becomes an issue.
  tracing:
    sampling:
      probability: 1.0
  observations:
    annotations:
      enabled: true

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  include-application-name: false
  level:
    root: debug
    javax: error
    sun: error
    netflix: error
    jdk: error

    io:
      github:
        resilience4j: error
    com:
      netfix: error
      beancounter: debug
      zaxxer: error
      github.victools: error
    org:
      springframework: error
      hibernate: error
      apache: error
      postgres: error

# Resilience4j configuration for svc-agent
# Circuit breaker and retry for calls to bc-data, bc-event, bc-position
resilience4j:
  circuitbreaker:
    configs:
      default:
        failureRateThreshold: 3
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: TIME_BASED
        waitDurationInOpenState: 5s
        registerHealthIndicator: true
        recordFailurePredicate: com.beancounter.common.exception.RecordFailurePredicate

  retry:
    configs:
      default:
        waitDuration: 10s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
        ignoreExceptions:
          - com.beancounter.common.exception.BusinessException
    instances:
      bcData:
        baseConfig: default
      bcEvent:
        baseConfig: default
      bcPosition:
        baseConfig: default

spring:
  application:
    name: bc-agent
  boot:
    admin:
      client:
        # Spring Boot Admin client. Disabled by default; enabled in kauri via
        # SBA_CLIENT_ENABLED=true + SBA_SERVER_URL=http://bc-admin:9530.
        enabled: ${SBA_CLIENT_ENABLED:false}
        url: ${SBA_SERVER_URL:http://localhost:9530}
        username: ${SBA_REGISTRATION_USERNAME:admin}
        password: ${SBA_REGISTRATION_PASSWORD:}
        instance:
          management-base-url: ${MANAGEMENT_BASE_URL:http://localhost:9531}
          metadata:
            tags:
              service: bc-agent
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${auth.uri}
          audience: ${auth.audience}
  # Conversation history store. In-memory H2 by default (tests, a bare
  # bootRun); application-local.yaml and kauri point it at the `agent`
  # Postgres database and enable Flyway.
  datasource:
    url: jdbc:h2:mem:agent;DB_CLOSE_DELAY=-1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        physical_naming_strategy: com.beancounter.common.config.QuotedSnakeCaseNamingStrategy
  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
  ai:
    # Dummy OpenAI + Ollama + Anthropic config keeps their autoconfigurations
    # from failing on missing keys. The provider actually used is chosen by
    # `agent.provider` below (see ChatClientConfiguration); the application-<provider>.yaml
    # presets override these dummies for their own provider.
    openai:
      api-key: "dummy-key-to-prevent-errors"
    ollama:
      base-url: "http://undefined:11434"
    anthropic:
      api-key: "dummy-key-to-prevent-errors"
    # DeepSeek is the default provider, via Spring AI's native DeepSeek module
    # (spring-ai-starter-model-deepseek): DeepSeekChatModel + DeepSeekChatOptions,
    # with chain-of-thought surfaced via DeepSeekAssistantMessage.getReasoningContent().
    # Spring AI echoes `reasoning_content` back into outgoing assistant messages
    # (DeepSeekChatModel.createRequest), which DeepSeek requires on multi-turn
    # tool calls (it 400s otherwise), so thinking mode is safe with tools.
    #
    # The endpoint is any OpenAI-compatible LLM gateway or DeepSeek itself:
    # AI_GATEWAY_URL / AI_GATEWAY_KEY. DEEPSEEK_API_KEY is accepted as a fallback key.
    deepseek:
      api-key: "${AI_GATEWAY_KEY:${DEEPSEEK_API_KEY:}}"
      base-url: "${AI_GATEWAY_URL:https://api.deepseek.com}"
      chat:
        options:
          model: "${AI_MODEL_FAST:${DEEPSEEK_MODEL_FAST:deepseek-flash}}"
          temperature: 0.2
          max-tokens: 4096

    model:
      chat: deepseek

agent:
  # Chat provider: deepseek | anthropic | openai | ollama. The matching
  # application-<provider>.yaml profile presets this plus the provider properties.
  provider: deepseek
  # Per-tier model IDs. ChatModelSelector picks one per call based on the page
  # context (Holdings / News / Asset Review / Independence / Rebalance).
  # Override per environment via AI_MODEL_FAST / _SMART / _DEEP.
  #
  # Models (DeepSeek API, current as of 2026-09):
  #   deepseek-flash    - GA general model (V4.1-Flash). Tool calling, 1M context,
  #                       cheap. Defaults to *thinking* mode: the fast client sends
  #                       `thinking: disabled`, the Chat FAB client sends
  #                       `reasoning_effort: low` (see DeepSeekThinking).
  #   deepseek-v4-pro   - higher-quality tier (~3x cost); the deep tier.
  #   deepseek-v4-flash - deprecated legacy name, still served by V4.1-Flash.
  #   deepseek-chat / deepseek-reasoner - discontinued 2026-07-24. Do not configure.
  models:
    fast: "${AI_MODEL_FAST:${DEEPSEEK_MODEL_FAST:deepseek-flash}}"
    smart: "${AI_MODEL_SMART:${DEEPSEEK_MODEL_SMART:deepseek-flash}}"
    deep: "${AI_MODEL_DEEP:${DEEPSEEK_MODEL_DEEP:deepseek-v4-pro}}"
  conversations:
    # Conversations idle longer than this are purged by ConversationRetention.
    retention-days: 90
    purge-cron: "0 15 3 * * *"

# Security Configuration - uses same auth.* properties as all other services
# Helm sets AUTH_URI and AUTH_AUDIENCE via spring.auth template
auth:
  uri: "https://your-auth0-endpoint"
  audience: "auth0-audience"
  enabled: true
  email: "${auth.audience}/claims/email"
  web: true
  # Trust svc-data as a second JWT issuer (bc-claude/MCP.md phase 2) so
  # tokens minted locally by svc-data's /api-keys/token are accepted here
  # too. JWKS fetch is lazy, so this adds no startup coupling.
  bc-issuer:
    uri: "http://localhost:9510/api/"
