# fantail service definition — discovered by `fantail` (see monowai/fantail)
description: Market data, portfolios, trns (bc-data)
cwd: ..                          # gradle runs from the mono-repo root
# fallback launch — used by `fantail start --no-dev`; see `reload:` below
command: ["./gradlew", ":svc-data:bootRun", "--args=--spring.profiles.active=${self.profile}"]
profile: local                   # the one config knob — ${self.profile} above
port: 9510
health: http://localhost:9511/actuator/health
env:                             # instance offsets reach the JVM via env
  SERVER_PORT: "${self.port}"
  MANAGEMENT_SERVER_PORT: "${self.health_port}"
# Presence of `reload:` changes how `command:` above is used: `fantail start`
# ignores it and launches a plain java process instead, so the gradle daemon
# stays free to recompile while the service runs and `fantail reload` can
# restart the app context via devtools in ~10s. `command:` remains the
# fallback — `fantail start --no-dev` runs bootRun exactly as written.
# Changes to jar-common/jar-auth still need a full restart: they load as jars.
reload:
  gradle: ":svc-data"

requires:
  - tcp: localhost:5432          # postgres (db: bc)
  - env: AUTH0_CLIENT_SECRET     # auth.client-secret in application-local.yml; M2M dead without
wants:
  - tcp: localhost:5672          # rabbit — ssh -f -N -L 5672:192.168.139.2:30672 kauri

# untracked runtime files copied into worktrees on start (fantail worktree fallback)
runtime_config:
  - src/main/resources/application-local.yml
